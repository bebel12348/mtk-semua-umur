<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Player</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #000;
  color: #fff;
  display: flex;
  height: 100vh;
}
.player-area { flex: 1; display: flex; flex-direction: column; }
video { width: 100%; height: 100%; background: #000; }
.sidebar {
  width: 280px;
  background: #111;
  border-left: 1px solid #222;
  overflow-y: auto;
}
.channel {
  padding: 12px 16px;
  border-bottom: 1px solid #222;
  cursor: pointer;
}
.channel:hover { background: #1a1a1a; }
.channel.active { background: #e50914; }
.channel-name { font-weight: 600; font-size: 14px; }
.channel-desc { font-size: 12px; color: #888; margin-top: 2px; }
.controls {
  padding: 10px;
  background: #111;
  display: flex;
  gap: 8px;
  align-items: center;
}
button {
  padding: 8px 14px;
  background: #e50914;
  border: none;
  border-radius: 4px;
  color: #fff;
  cursor: pointer;
  font-weight: 600;
}
button:hover { background: #c40812; }
.status { font-size: 12px; color: #888; margin-left: auto; }
@media (max-width: 768px) {
  body { flex-direction: column; }
 .sidebar { width: 100%; height: 180px; border-left: none; border-top: 1px solid #222; }
}
</style>
</head>
<body>
<div class="player-area">
  <video id="video" controls autoplay muted></video>
  <div class="controls">
    <button id="playBtn">Play</button>
    <button id="stopBtn">Stop</button>
    <div class="status" id="status">Pilih channel</div>
  </div>
</div>

<div class="sidebar" id="channelList"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const video = document.getElementById('video');
const status = document.getElementById('status');
const channelList = document.getElementById('channelList');
let hls = null;

// Channel yang stabil & publik. Test dulu pakai ini
const channels = [
  {
    name: "NASA TV UHD",
    desc: "Space & Earth live",
    url: "https://nasa-i.akamaihd.net/hls/live/253565/NASA-NASAHD2/master.m3u8"
  },
  {
    name: "Big Buck Bunny Test",
    desc: "Test stream HLS",
    url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
  },
  {
    name: "BBC News",
    desc: "News live",
    url: "https://vs-hls-pushb-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=vs/hls/uk/manifest.m3u8"
  }
];

function loadChannels() {
  channels.forEach((ch, i) => {
    const div = document.createElement('div');
    div.className = 'channel' + (i === 0? ' active' : '');
    div.innerHTML = `<div class="channel-name">${ch.name}</div><div class="channel-desc">${ch.desc}</div>`;
    div.onclick = () => playChannel(ch, div);
    channelList.appendChild(div);
  });
}

function playChannel(channel, element) {
  document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
  element.classList.add('active');

  status.textContent = `Loading ${channel.name}...`;

  if (hls) {
    hls.destroy();
    hls = null;
  }

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(channel.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play();
      status.textContent = `Playing ${channel.name}`;
    });
    hls.on(Hls.Events.ERROR, () => {
      status.textContent = `Error: Link mati atau diblokir`;
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = channel.url;
    video.play();
    status.textContent = `Playing ${channel.name}`;
  } else {
    status.textContent = 'Browser tidak support HLS';
  }
}

document.getElementById('playBtn').onclick = () => video.play();
document.getElementById('stopBtn').onclick = () => {
  video.pause();
  if (hls) hls.destroy();
  status.textContent = 'Stopped';
};

loadChannels();
playChannel(channels[0], document.querySelector('.channel'));
</script>
</body>
</html>
